  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--pad:clamp(1.25rem,5vw,5.5rem)}

    .page-header{position:fixed;z-index:50;top:0;left:0;width:100%;height:clamp(4.7rem,7vw,6.2rem);display:flex;align-items:center;justify-content:center;padding:0 var(--pad);pointer-events:none}

    @media(max-width:800px){.page-header{justify-content:flex-start}.page-logo{width:6.8rem}.page-nav{gap:.7rem}.page-nav a{font-size:.55rem}.shop-placeholder p{font-size:.78rem}}
